name: SF2 phase-6 residual confidence protection
on:
  push:
    branches: [deliverables/sf2-phase6]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  frozen-phase5-and-current-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build/test immutable previous phase-5 HEAD (all original 20 regressions)
        run: |
          BASE=701fcb0df6541d5ede0d0b451159934ae9a6928b
          git worktree add --detach "$RUNNER_TEMP/sf2-phase5-frozen" "$BASE"
          cmake -S "$RUNNER_TEMP/sf2-phase5-frozen/app/src/test/cpp" \
            -B "$RUNNER_TEMP/sf2-phase5-tests" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/sf2-phase5-tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/sf2-phase5-tests" --output-on-failure
      - name: Compile phase-6 CPU oracle and all prior native tests with assertions enabled
        run: |
          cmake -S app/src/test/cpp -B build-sf2-phase6 \
            -DCMAKE_BUILD_TYPE=Release -DSF2_ISOLATED_PHASE6=ON
          cmake --build build-sf2-phase6 --parallel 2
      - name: Run current phase-6 native quality and protected-source contracts
        run: ctest --test-dir build-sf2-phase6 --output-on-failure
      - name: Print deterministic confidence-structure quality measurements
        run: |
          ./build-sf2-phase6/SingleFrameResidualConfidenceTest
          ./build-sf2-phase6/SingleFrameResidualCandidateQualityTest
      - name: Install Vulkan GLSL compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc
      - name: Compile production resident Vulkan shader to SPIR-V
        run: |
          glslc --target-env=vulkan1.1 -O \
            -I app/src/main/cpp/vulkan/shaders \
            -o /tmp/sf2-phase6-resident.spv \
            app/src/main/cpp/vulkan/shaders/spectra_demosaic_resident.comp
          test -s /tmp/sf2-phase6-resident.spv
      - name: Package only phase-6 changed files with base-relative patch
        shell: bash
        run: |
          BASE=701fcb0df6541d5ede0d0b451159934ae9a6928b
          mkdir -p phase6_delta_files
          while IFS= read -r file; do
            mkdir -p "phase6_delta_files/$(dirname "$file")"
            cp -- "$file" "phase6_delta_files/$file"
          done < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)
          git diff --binary "$BASE" HEAD > BnCam_SF2_F6_From_Phase5.patch
          zip -qr BnCam_SF2_F6_Delta.zip phase6_delta_files BnCam_SF2_F6_From_Phase5.patch
      - uses: actions/upload-artifact@v4
        with:
          name: BnCam_SF2_F6_Delta
          path: BnCam_SF2_F6_Delta.zip
          if-no-files-found: error

  optional-android-debug-apk:
    # Run once on the phase-6 final release; also available by manual dispatch.
    # Does not invalidate native/shader validation if the Android environment
    # cannot reproduce the developer's Gradle/SDK setup.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'SF2-D06 Final') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes Android command-line tools.
      # setup-android@v3 currently tries deprecated 'sdkmanager tools' and
      # fails before Gradle starts. Use the runner's current sdkmanager.
      - name: Configure preinstalled Android SDK and required components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build phase-6 Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: Upload APK only if compilation actually succeeded
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BnCam_SF2_F6_Confidence_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
