name: SF2 FINAL Balanced default — native regression and installable APK
on:
  push:
    branches: [deliverables/sf2-phase9-balanced-default]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  qualify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Frozen D08 native suite must pass without modification
        run: |
          git worktree add --detach "$RUNNER_TEMP/frozen-d08" 572ef4546a6fd0ecdb67dfb7f87d64f0f452a132
          cmake -S "$RUNNER_TEMP/frozen-d08/app/src/test/cpp" -B "$RUNNER_TEMP/build-d08" -DCMAKE_BUILD_TYPE=Release -DSF2_ISOLATED_PHASE8=ON
          cmake --build "$RUNNER_TEMP/build-d08" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/build-d08" --output-on-failure
      - name: Product default and rollback native contract
        run: |
          cmake -S app/src/test/cpp -B build-sf2-final -DCMAKE_BUILD_TYPE=Release -DSF2_ISOLATED_PHASE9=ON
          cmake --build build-sf2-final --parallel 2
          ctest --test-dir build-sf2-final --output-on-failure
          ctest --test-dir build-sf2-final -R SingleFrameBalancedDefaultContractTest -V
      - name: Collector and debug UI regression
        run: |
          python3 -m unittest discover -s tests -p test_sf2_phase7_collect.py -v
          python3 -m unittest discover -s tests -p test_sf2_phase9_default.py -v
          python3 scripts/sf2_phase7_collect.py --help
      - name: Check real Vulkan shader compilation to SPIR-V
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc
          glslc --target-env=vulkan1.1 -O -I app/src/main/cpp/vulkan/shaders -o /tmp/final-resident.spv app/src/main/cpp/vulkan/shaders/spectra_demosaic_resident.comp
          test -s /tmp/final-resident.spv
      - name: Configure Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Full Android debug APK build with promoted Balanced
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: Verify installable APK, release routing JNI and archive
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" > /tmp/final_apk_zipcheck.txt
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libbncam.so'
          unzip -p "$APK" lib/arm64-v8a/libbncam.so > /tmp/final-bncam.so
          nm -D /tmp/final-bncam.so | grep -F 'Java_com_bncam_core_engine_ImageUtils_clearPhysicalLumaDebugOverride'
          nm -D /tmp/final-bncam.so | grep -F 'Java_com_bncam_core_engine_ImageUtils_validateSf2IntegrationNative'
          strings /tmp/final-bncam.so | grep -F 'GUIDED_V2_BALANCED_DEFAULT'
          sha256sum "$APK" | tee BnCam_SF2_FINAL_SHA256.txt
      - name: Package exact source delta
        run: |
          set -euo pipefail
          BASE=572ef4546a6fd0ecdb67dfb7f87d64f0f452a132
          mkdir -p sf2_final_changed_files
          while IFS= read -r path; do
            mkdir -p "sf2_final_changed_files/$(dirname "$path")"
            cp -- "$path" "sf2_final_changed_files/$path"
          done < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)
          git diff --binary "$BASE" HEAD > BnCam_SF2_FINAL.patch
          zip -qr BnCam_SF2_FINAL_Source_Delta.zip sf2_final_changed_files BnCam_SF2_FINAL.patch BnCam_SF2_FINAL_SHA256.txt
          test -s BnCam_SF2_FINAL_Source_Delta.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BnCam_SF2_FINAL_Balanced_Default_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            BnCam_SF2_FINAL_SHA256.txt
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BnCam_SF2_FINAL_Balanced_Source_Delta
          path: BnCam_SF2_FINAL_Source_Delta.zip
          retention-days: 90
          if-no-files-found: error
